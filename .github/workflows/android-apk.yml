name: Build Android APK

on:
  push:
    branches:
      - claude/mvp-android-apk-uzjrz9
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Valide les règles de contenu, puis simule 800 parties pour vérifier les
      # invariants du moteur. Aucun texte narratif n'est affiché.
      - name: Verify content and engine invariants
        run: npm run verifier

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # arm64-v8a couvre tous les téléphones sortis depuis ~2017 et garde l'APK
      # léger ; l'APK universel est le repli pour les appareils 32 bits.
      - name: Build arm64-only release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Stage arm64 APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/val-de-garde-${{ github.run_number }}-arm64.apk"

      - name: Build universal release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage universal APK
        id: apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/val-de-garde-${{ github.run_number }}-universal.apk"
          echo "tag=apk-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: val-de-garde-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APKs as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" \
            dist/*.apk \
            --title "Val-de-Garde APK (build ${{ github.run_number }})" \
            --notes "APK Android autonome, construit depuis \`${{ github.ref_name }}\` (\`${{ github.sha }}\`). Installation directe, sans compte Google Play. Utilise la version \`arm64\` sur un téléphone récent ; la version \`universal\` couvre aussi l'ARM 32 bits et les émulateurs x86." \
            --target "${{ github.sha }}" \
            --latest
          {
            echo "### APK prêt"
            echo ""
            gh release view "${{ steps.apk.outputs.tag }}" \
              --json assets --jq '.assets[] | "Téléchargement direct : \(.url)"'
          } >> "$GITHUB_STEP_SUMMARY"
