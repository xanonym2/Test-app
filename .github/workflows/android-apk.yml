name: Build Android APK

on:
  push:
    branches:
      - claude/expo-counter-apk-build-oiy5k7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        id: apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/compteur-${{ github.run_number }}.apk"
          echo "path=dist/compteur-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=apk-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: compteur-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" \
            "${{ steps.apk.outputs.path }}" \
            --title "Compteur APK (build ${{ github.run_number }})" \
            --notes "Standalone Android APK built from \`${{ github.ref_name }}\` at \`${{ github.sha }}\`. Sideload it directly - no Google Play account needed." \
            --target "${{ github.sha }}" \
            --latest
          {
            echo "### APK ready"
            echo ""
            gh release view "${{ steps.apk.outputs.tag }}" \
              --json assets --jq '.assets[] | "Direct download: \(.url)"'
          } >> "$GITHUB_STEP_SUMMARY"
