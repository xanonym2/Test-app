name: Build Android APK

on:
  push:
    branches:
      - claude/expo-counter-apk-build-oiy5k7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # arm64-v8a alone covers every Android phone shipped since ~2017 and keeps
      # the APK small enough to pass around; the universal one is the fallback
      # for older 32-bit devices and x86 emulators.
      - name: Build arm64-only release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Stage arm64 APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/compteur-${{ github.run_number }}-arm64.apk"

      - name: Build universal release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage universal APK
        id: apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/compteur-${{ github.run_number }}-universal.apk"
          echo "tag=apk-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: compteur-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APKs as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" \
            dist/*.apk \
            --title "Compteur APK (build ${{ github.run_number }})" \
            --notes "Standalone Android APKs built from \`${{ github.ref_name }}\` at \`${{ github.sha }}\`. Sideload directly - no Google Play account needed. Use the \`arm64\` build on any modern phone; the \`universal\` build also covers 32-bit ARM and x86 emulators." \
            --target "${{ github.sha }}" \
            --latest
          {
            echo "### APK ready"
            echo ""
            gh release view "${{ steps.apk.outputs.tag }}" \
              --json assets --jq '.assets[] | "Direct download: \(.url)"'
          } >> "$GITHUB_STEP_SUMMARY"
